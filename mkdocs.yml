site_name: OpenAPI Petstore
site_url: https://grokify.github.io/petstore/
site_description: OpenAPI Petstore — a server with optional AAuth, and Postman AI-readiness reports

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: deep orange
      accent: deep orange
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: deep orange
      accent: deep orange
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.top
    - content.code.copy

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables

nav:
  - Home: index.md
  - Guides:
    - Run the Server: guides/server.md
    - Test AAuth Interop: guides/aauth-interop.md
    - MySQL Tools: guides/mysql-tools.md
    - Postman AI Readiness: guides/postman/index.md
  - Releases:
    - v0.2.0: releases/v0.2.0.md
    - v0.1.0: releases/v0.1.0.md
